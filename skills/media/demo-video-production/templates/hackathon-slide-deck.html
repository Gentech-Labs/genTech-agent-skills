<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1920px;height:1080px;overflow:hidden;background:linear-gradient(135deg,#0a0a0f 0%,#1a1a2e 50%,#0a0a0f 100%);font-family:Liberation Sans, DejaVu Sans, Arial, sans-serif;display:flex;flex-direction:column;justify-content:center;align-items:center}
.badge{background:#f7931a22;color:#f7931a;padding:12px 24px;border-radius:50px;font-size:22px;font-weight:600;letter-spacing:0.05em;margin-bottom:40px;border:1px solid #f7931a44}

<div class="badge">HACKATHON_NAME</div>
<h1>PROJECT <span>NAME</span></h1>
<p>Tagline goes here</p>

SLIDE DECK STRUCTURE (6 slides, 4 seconds each = 24 seconds):
1. Title: Badge + H1 + subtitle
2. Problem: .tag + h2 + 3x .card grid
3. Solution: .tag + h2 + 3x .step flow
4. Architecture: .tag + h2 + .arch pipeline
5. Output: .tag + h2 + 2x2 .output-card grid with .code blocks

# Simple Password Gate for Hub Pages

A lightweight client-side password gate to protect content until the user is ready to go public.

## Implementation

### CSS (add inside `<style>` tags):

```css
#password-gate {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: #0a0a0f; z-index: 99999;
  display: flex; align-items: center; justify-content: center;
  flex-direction: column;
}
#password-gate.hidden { display: none; }
#password-gate .lock-icon { font-size: 3rem; margin-bottom: 16px; }
#password-gate h2 { color: #cc3333; font-family: 'Cinzel', serif; margin-bottom: 8px; }
#password-gate p { color: #887777; font-size: 0.85rem; margin-bottom: 20px; text-align: center; }
#password-gate input {
  background: #1a1a24; border: 1px solid #5d2a0a; color: #eee;
  padding: 12px 16px; border-radius: 8px; font-size: 1rem; width: 220px; text-align: center; outline: none;
}
#password-gate input:focus { border-color: #cc3333; box-shadow: 0 0 12px rgba(200,50,50,0.2); }
#password-gate button {
  background: #cc3333; color: white; border: none; padding: 10px 24px; border-radius: 8px;
  font-size: 0.9rem; cursor: pointer; margin-top: 12px; font-weight: 600;
}
#password-gate .error { color: #ff4444; font-size: 0.8rem; margin-top: 8px; display: none; }
#password-gate .error.show { display: block; }
```

### HTML (after `<body>`):

```html
<div id="password-gate">
  <div class="lock-icon">🔒</div>
  <h2>KAGEKŌ</h2>
  <p>This content is locked. Enter the password to access.</p>
  <input type="password" id="pw-input" placeholder="Enter password" onkeydown="if(event.key==='Enter')checkPW()">
  <button onclick="checkPW()">Unlock</button>
  <div class="error" id="pw-error">Incorrect password. Try again.</div>
</div>
```

### JavaScript:

```html
<script>
function checkPW(){
  var pw=document.getElementById('pw-input').value;
  if(pw==='YourPasswordHere!'){
    document.getElementById('password-gate').classList.add('hidden');
    localStorage.setItem('vanito_unlocked','true');
  } else {
    document.getElementById('pw-error').classList.add('show');
  }
}
if(localStorage.getItem('vanito_unlocked')==='true'){
  document.getElementById('password-gate').classList.add('hidden');
}
</script>
```

## How it works
- On first visit: shows the lock screen, user enters password
- On correct password: hides the gate, saves to localStorage so they don't have to re-enter on same device
- To remove the gate entirely: just delete the `#password-gate` div and associated CSS/JS
